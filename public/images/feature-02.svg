<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky-blue-grad-02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#12487e" />
      <stop offset="25%" stopColor="#1b63a5" />
      <stop offset="60%" stopColor="#3187cb" />
      <stop offset="100%" stopColor="#7cb6e4" />
    </linearGradient>
    <linearGradient id="cloud-shadow-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ccdbe8" />
      <stop offset="100%" stopColor="#f3eee3" />
    </linearGradient>
  </defs>

  <!-- Deep Japanese Indigo / Azure Gradient Sky -->
  <rect width="400" height="400" fill="url(#sky-blue-grad-02)" />

  <!-- Distant High Altocumulus Ripples -->
  <g stroke="#ffffff" strokeWidth="2.5" fill="none" opacity="0.35" strokeLinecap="round">
    <path d="M-10 40 Q40 32 90 38 Q140 44 200 36 Q260 28 320 35 Q370 42 410 36" />
    <path d="M20 58 Q70 50 130 55 Q190 60 250 52 Q310 45 380 54" />
    <path d="M-20 78 Q50 68 110 74 Q170 80 240 70 Q300 62 370 72" />
  </g>

  <!-- Upper Tier Woodblock Clouds -->
  <path
    d="M-20 120 Q30 85 90 105 Q150 75 220 100 Q280 75 350 105 Q385 90 420 115 L420 160 Q360 145 290 155 Q210 135 140 150 Q60 135 -20 160 Z"
