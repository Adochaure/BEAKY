  <path d="M40 185 Q120 168 220 182 Q300 172 370 190" stroke="#a0c8e8" strokeWidth="3" fill="none" opacity="0.6" />

  <!-- Huge Billowing Low Cumulus Cloud Bank (Center Stage) -->
  <!-- Base Shadow Layer -->
  <path
    d="M-20 230 Q40 180 110 205 Q180 165 260 195 Q330 170 420 215 L420 310 Q340 285 250 300 Q160 275 80 295 Q10 280 -20 310 Z"
    fill="url(#cloud-shadow-grad)"
