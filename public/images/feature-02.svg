  <path
    d="M-20 260 Q30 205 95 230 Q160 190 235 220 Q300 195 380 235 Q405 225 420 245 L420 420 L-20 420 Z"
    fill="#ffffff"
  />

  <!-- Woodblock Inked Contours and Shading Folds -->
  <path d="M10 250 Q65 220 120 245" stroke="#1d4d77" strokeWidth="2" fill="none" strokeLinecap="round" />
  <path d="M135 235 Q185 205 240 230" stroke="#1d4d77" strokeWidth="2" fill="none" strokeLinecap="round" />
  <path d="M255 230 Q315 205 375 240" stroke="#1d4d77" strokeWidth="2" fill="none" strokeLinecap="round" />

  <!-- Cloud Volume Inner Rings -->
  <path d="M30 275 Q80 250 140 270 M160 260 Q215 240 270 265 M280 265 Q335 245 385 272" stroke="#dbe5ed" strokeWidth="3" fill="none" />
  <path d="M-10 330 Q60 295 150 320 Q240 290 320 315 Q370 300 420 330" stroke="#ccd9e4" strokeWidth="2" fill="none" />

  <!-- Warm Sunlit Rim on Bottom Cloud Deck -->
  <path
    d="M-20 350 Q50 315 130 335 Q210 305 290 330 Q350 315 420 345 L420 420 L-20 420 Z"
